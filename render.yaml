# Render Blueprint: deploy with "New > Blueprint" and point it at this repository.
# Secrets marked `sync: false` are entered in the Render dashboard, never committed.
services:
  - type: web
    name: ai-document-assistant
    runtime: docker
    plan: free
    region: ohio
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: anthropic
      - key: CHAT_MODEL
        value: claude-haiku-4-5
      - key: EMBEDDING_MODEL
        value: voyage-3.5-lite
      # Requests reach the app through Cloudflare and Render's load balancer, so
      # X-Forwarded-For ends with "<client>, <cloudflare>, <render internal>".
      # The real client is the 3rd entry from the right (verified in production).
      - key: TRUSTED_PROXY_HOPS
        value: "3"
      - key: AUTHOR_NAME
        value: Felix Martinez
